[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/NVIDIA/OpenShell"

[workspace.dependencies]
# Libraries inherit only the facade. Executable packages select their backend.
openshell-crypto = { path = "crates/openshell-crypto", default-features = false }
# Async runtime
tokio = { version = "1.53.3", features = ["full"] }

# gRPC/Protobuf
tonic = "0.14"
tonic-types = "0.14"
tonic-reflection = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"
prost-types = "0.14"
prost-reflect = { version = "0.16.5", features = ["serde"] }

# HTTP server
# WebSocket support (`ws`) needs a companion feature picking its
# Sec-WebSocket-Accept hash implementation (`ws-rust-crypto` vs `openssl`,
# forwarded per-binary from openshell-server's own crypto-openssl/
# crypto-aws-lc selection), so it isn't hardcoded here.
axum = { version = "0.8" }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "request-id"] }
hyper = { version = "1.6", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
http = "1.2"
http-body = "1.0"
http-body-util = "0.1"
h2 = "0.4"

# TLS
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["std", "logging", "tls12"] }
rcgen = { version = "0.14.10", default-features = false, features = ["pem"] }
webpki-roots = "1"
rustls-native-certs = "0.8"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = { version = "4.5", features = ["unstable-dynamic"] }
indicatif = "0.17"
owo-colors = "4"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache", "underline-color"] }
crossterm = "0.28"
terminal-colorsaurus = "1.0"

# Error handling
miette = { version = "7", features = ["fancy"] }
thiserror = "2"

# Windows platform APIs (ETW/TDH audit consumer in openshell-driver-mxc; Windows-only)
windows = { version = "0.62", features = ["Wdk_System_Threading", "Win32_Foundation", "Win32_System_Diagnostics_Etw", "Win32_System_Time"] }
anyhow = "1"

# Logging/Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# OpenTelemetry — OTLP/gRPC export. Kept in lockstep with the workspace's
# tonic 0.14 / prost 0.14 via opentelemetry-proto's `grpc-tonic` feature.
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic", "trace"] }
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
opentelemetry-http = { version = "0.33", default-features = false }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["grpc-tonic", "gzip-tonic", "tls-provider-agnostic", "tls-roots", "trace"] }
tracing-opentelemetry = { version = "0.34", default-features = false, features = ["tracing-log"] }

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }

# Unix/Process
nix = { version = "0.29", features = ["signal", "process", "user", "fs", "term"] }
rustix = { version = "1.1", features = ["process"] }
socket2 = "0.6"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "=0.58.6", default-features = false }
serde_path_to_error = "0.1"
serde_yml = { package = "noyalib", version = "0.0.53", default-features = false, features = ["std", "compat-serde-yaml"] }
toml = "0.8"
apollo-parser = "0.8.5"
tower-mcp-types = "=0.22.2"
regex = "1"

# HTTP client
# TLS backend (rustls vs native-tls/OpenSSL) is selected per-binary by
# openshell-crypto's `aws-lc`/`openssl` features, not hardcoded here.
reqwest = { version = "0.12.28", default-features = false, features = ["json"] }

# AWS SDK
aws-config = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio", "behavior-version-latest"] }
aws-sdk-sts = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio", "behavior-version-latest"] }

# WebSocket
# Bumped from 0.26 to match the version axum resolves to (its own
# `tokio-tungstenite` dependency, see the [patch.crates-io] entries
# below): unifying on one tungstenite instance everywhere is what
# resolves cargo-fips-check's bare-name sha1 ambiguity (RHOAIENG-97009).
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-native-roots"] }

# Clipboard (OSC 52)
base64 = "0.22"

# Crypto / Auth
rand = "0.9"
jsonwebtoken = { version = "10", default-features = false, features = ["use_pem"] }
zeroize = { version = "1", features = ["derive"] }
getrandom = "0.3"
aws-lc-rs = "1.16"
# jsonwebtoken backend (jwt-verify-aws-lc-rs vs jwt-verify-openssl) is
# selected per-binary by openshell-crypto's `aws-lc`/`openssl` features.
spiffe = { version = "0.15", default-features = false, features = ["workload-api-jwt", "tracing"] }

# Filesystem embedding
include_dir = "0.7"

# Glob matching
glob = "0.3"

# Utilities
futures = "0.3"
bytes = "1"
hickory-proto = "0.26.1"
pin-project-lite = "0.2"
tokio-stream = "0.1"
protoc-bin-vendored = "3.2.0"
url = "2"
indexmap = "2"
shell-words = "1.1.1"

# Database
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "sqlite", "migrate", "macros"] }
# SQLx's facade couples native roots to ring; select native roots independently.
sqlx-core = { version = "0.9", default-features = false, features = ["rustls-native-certs"] }

# Kubernetes
# TLS backend (rustls vs OpenSSL) is selected per-binary by openshell-crypto's
# `aws-lc`/`openssl` features, not hardcoded here.
kube = { version = "0.99", default-features = false, features = ["client", "runtime", "derive"] }
kube-runtime = "0.99"
k8s-openapi = { version = "0.24", features = ["v1_29"] }

# IDs
uuid = { version = "1.10", features = ["v4"] }
signal-hook = "0.3"

# SMT solver (system libz3 by default; opt into vendored source or a prebuilt release)
z3 = "0.22"

[workspace.lints.rust]
unsafe_code = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Allow certain pedantic lints that are too noisy
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# Allow noisy nursery lints
significant_drop_tightening = "allow"  # Often gives incorrect suggestions
missing_const_for_fn = "allow"  # Too noisy for async code patterns

# Allow noisy pedantic lints
too_many_lines = "allow"  # Function length limits are subjective
needless_pass_by_value = "allow"  # Common pattern in async handlers
ref_option = "allow"  # Common pattern for optional references
missing_fields_in_debug = "allow"  # Manual Debug impls often intentionally omit fields

[profile.release]
strip = true

[profile.dev]
# Faster compile times for dev builds
debug = 1

# Executable identity hashes the (100+ MiB) test binary. Unoptimized SHA-256
# is ~10x slower, which times out broker tests.
[profile.dev.package.sha2]
opt-level = 3

# RHOAIENG-97009: forks adding an optional OpenSSL-backed crypto backend
# (feature `openssl`), for FIPS builds where `aws-lc-rs`'s own crypto isn't
# an attested/certified module. russh needs ssh-key pinned to exactly
# 0.7.0-rc.12 (`=` requirement in russh/Cargo.toml), so the ssh-key fork is
# rebased on that exact upstream tag.
[patch.crates-io]
russh = { git = "https://github.com/akram/russh", branch = "feat/optional-openssl-gcm-backend" }
ssh-key = { git = "https://github.com/akram/rust-ssh-key", branch = "feat/openssl-pkcs8-and-keygen" }
# ssh-key depends on ssh-cipher as a plain crates.io version requirement (no
# in-repo `path`, even though both live in the same rust-ssh-key workspace),
# so it needs its own patch entry to pick up the same fork/branch.
ssh-cipher = { git = "https://github.com/akram/rust-ssh-key", branch = "feat/openssl-pkcs8-and-keygen" }
# Adds `jwt-verify-openssl`: no jsonwebtoken crypto backend compiled in, so
# aws-lc-rs is not pulled in just for spiffe's JWT-SVID verification. The
# embedder (openshell-gateway) installs its own OpenSSL-backed
# jsonwebtoken::crypto::CryptoProvider before any JWT op can run.
spiffe = { git = "https://github.com/akram/rust-spiffe", branch = "feat/jwt-verify-openssl" }
# Adds `openssl`/`md5-rust-crypto` to sqlx-postgres (unmodified otherwise,
# based directly on the upstream v0.9.0 tag): the legacy postgres `md5`
# password-authentication method hardcoded a non-optional RustCrypto md-5
# dependency with no feature to avoid it. sqlx-postgres and sqlx-core are
# left unpatched directly: sqlx's own Cargo.toml reaches both via an
# in-repo `path`, so patching `sqlx` alone is enough, and patching
# sqlx-postgres on top of that creates a second, separately-resolved
# instance that doesn't unify features with the one reached through sqlx
# (silently drops the forwarded openssl/md5-rust-crypto feature).
sqlx = { git = "https://github.com/akram/sqlx", branch = "feat/openssl-md5-password" }
# Adds `openssl`/`ws-rust-crypto` to axum's `ws` feature: the WebSocket
# Sec-WebSocket-Accept handshake hash hardcoded a non-optional RustCrypto
# sha1 dependency with no feature to avoid it, and `tokio-tungstenite`'s
# own default features pulled in a second, separate sha1 (via its own
# `handshake` feature) that axum's shipped code never actually needs.
axum = { git = "https://github.com/akram/axum", branch = "feat/openssl-ws-accept" }
# Adds `openssl`/`sha3-rust-crypto` to ml-kem's G/H/J/PRF/XOF (FIPS 203's
# own SHA3-512/256/SHAKE256/SHAKE128 auxiliary functions, used by russh's
# mlkem768x25519-sha256 hybrid KEX): routes them through OpenSSL instead
# of the RustCrypto sha3/shake crates, which had no feature to avoid them.
ml-kem = { git = "https://github.com/akram/KEMs", branch = "feat/openssl-sha3-shake" }
# Bumps sha1 from upstream's own 0.10 pin to the 0.11 generation used
# throughout the other forks above (RHOAIENG-97009): axum's own
# `ws-rust-crypto` sha1 (bumped alongside this one, same reasoning) and
# tungstenite's own internal handshake sha1 (this one, reached both
# through axum's tokio-tungstenite dependency and OpenShell's own direct
# one, bumped to 0.29 above to unify on a single tungstenite instance).
tungstenite = { git = "https://github.com/akram/tungstenite-rs", branch = "feat/openssl-sha1-unify" }
# Bumps sha1 from upstream's own 0.10 pin to 0.11 (RHOAIENG-97009): `headers`
# (reached transitively via kube-client -> hyper-http-proxy, for the
# Kubernetes compute driver's HTTP-proxy support) hardcodes the same
# `Sec-WebSocket-Accept` sha1 computation as axum/tungstenite above, with
# no feature to avoid it. This was the final remaining sha1 0.10 source
# once axum/tungstenite/russh/ssh-key were all unified on 0.11.
headers = { git = "https://github.com/akram/headers", branch = "feat/openssl-sha1-unify" }
