[workspace]

[package]
name = "network-policy-mock-interceptor"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "network-policy-mock-interceptor"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
openshell-core = { path = "../../crates/openshell-core", default-features = false }
prost = "0.14"
prost-types = "0.14"
serde_json = "1"
serde_yml = "0.0.12"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "signal"] }
tonic = { version = "0.14", features = ["transport"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
